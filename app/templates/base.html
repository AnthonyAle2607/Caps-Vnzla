<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="CAPS VNZLA - Catalogo premium de gorras urbanas." />
    <title>{% block title %}CAPS VNZLA{% endblock %}</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}" />
  </head>
  <body>
    <header class="site-header">
      <nav class="nav container" aria-label="Navegación principal">
        <a href="{{ url_for('catalog.index') }}" class="brand" aria-label="Ir al inicio">
          <span class="brand-mark">RR</span>
          CAPS VNZLA
        </a>

        <ul class="nav-links" aria-label="Menú principal">
          <li><a href="#catalog">Catálogo</a></li>
          <li><a href="#featured">Novedades</a></li>
          <li><a href="#shop">Colecciones</a></li>
          <li><a href="#contact">Contacto</a></li>
        </ul>

        <div class="nav-actions">
          <div class="currency-switcher" aria-label="Cambio de moneda">
            <button type="button" class="currency-btn active" data-currency="USD">USD</button>
            <button type="button" class="currency-btn" data-currency="BS">BS</button>
          </div>
          <button type="button" class="cart-toggle" id="cart-toggle" aria-label="Abrir carrito">
            Carrito
            <span id="cart-count">0</span>
          </button>
        </div>
      </nav>
    </header>

    <main class="page-shell">
      {% block content %}{% endblock %}
    </main>

    <aside class="cart-panel" id="cart-panel" aria-live="polite" aria-label="Carrito de compras">
      <div class="cart-panel__header">
        <h3>Tu carrito</h3>
        <button type="button" class="close-cart" id="close-cart" aria-label="Cerrar carrito">×</button>
      </div>

      <div id="cart-items" class="cart-items"></div>

      <div class="cart-summary">
        <div class="summary-row">
          <span>Subtotal</span>
          <strong id="subtotal-display">$0.00</strong>
        </div>
        <div class="summary-row emphasis">
          <span>Total</span>
          <strong id="total-display">$0.00</strong>
        </div>
      </div>

      <button type="button" class="cta-button full-width">Procesar pedido</button>
    </aside>

    <div class="overlay" id="cart-overlay"></div>

    <script src="{{ url_for('static', filename='js/catalog.js') }}"></script>
    {% block scripts %}{% endblock %}
  </body>
</html>
